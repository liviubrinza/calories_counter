{# top bar of the inner pages; set appbar_eyebrow / appbar_title before including #}
<header class="appbar">
  <div class="appbar-inner">
    <a href="/" id="myButton" class="appbar-back" aria-label="Inapoi">
      <i class="fa fa-chevron-left" aria-hidden="true"></i><span class="d-none d-md-inline">Inapoi</span>
    </a>
    <div class="appbar-heading">
      <div class="appbar-eyebrow">{{ appbar_eyebrow }}</div>
      <h1 class="appbar-title">{{ appbar_title }}</h1>
    </div>
    <img class="appbar-logo" src="{{ url_for('static', filename='calories_tracker.png') }}" alt="">
  </div>
</header>
