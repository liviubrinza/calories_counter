{% extends "base.html" %}

{% block title %}Main Page{% endblock %}

{% block head %}
  {{ super() }}
  <style>
    .main-btn {
      width: 100%;
      max-width: 350px;
      font-weight: 600;
      padding: 15px 0;
    }
  </style>
{% endblock %}

{% block content %}
<div class="container py-5">

  <div class="text-center mb-5">
    <h1 class="display-5 fw-bold" style="color:#333;">Daily Tracker</h1>
    <p class="text-muted" style="font-size: 1.1rem;">Alege o secțiune pentru a continua</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-6 d-flex flex-column align-items-center" style="gap: 2.5rem;">

      <button onclick="location.href='products'"
              class="btn btn-primary btn-lg shadow-sm main-btn">
        <i class="fa fa-angle-double-left"></i>&nbsp; Produse
      </button>

      <button onclick="location.href='daily?user=Titi'"
              class="btn btn-danger btn-lg shadow-sm main-btn">
        Evidență zilnică (Titi) &nbsp; <i class="fa fa-angle-double-right"></i>
      </button>

      <button onclick="location.href='daily?user=Inci'"
              class="btn btn-lg shadow-sm main-btn"
              style="background-color: orange; color:white;">
        Evidență zilnică (Inci) &nbsp; <i class="fa fa-angle-double-right"></i>
      </button>

    </div>
  </div>

</div>
{% endblock %}
