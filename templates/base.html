<!DOCTYPE html>
<html lang="ro">
  <head>
    {% block head %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='calories_tracker.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='calories_tracker.png') }}">
    <title>{% block title %}{% endblock %} - Calory Counter</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/1.0.2/Chart.min.js"></script>
    <script>
      // shared look of the macro doughnut charts (Chart.js 1.x)
      var macroChartOptions = {
        responsive: true,
        maintainAspectRatio: true,
        percentageInnerCutout: 70,
        segmentShowStroke: true,
        segmentStrokeColor: '#ffffff',
        segmentStrokeWidth: 3,
        animationSteps: 50,
        animationEasing: 'easeOutQuart',
        tooltipFontFamily: "'Inter', sans-serif",
        tooltipFontSize: 13,
        tooltipCornerRadius: 8,
        tooltipTemplate: "<%= label %>: <%= Math.round(value * 100) %>%"
      };
    </script>
    {% endblock %}
  </head>
  <body>
    {% block header %}{% endblock %}
    <main id="content" class="page">{% block content %}{% endblock %}</main>
    <script src="{{ url_for('static', filename='js/product-search.js') }}"></script>
  </body>
</html>
